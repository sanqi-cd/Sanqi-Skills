<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8周从运营表格到独立数据分析项目</title>
<style>
:root{--ink:#17211b;--muted:#66706a;--paper:#f5f7f3;--panel:#fff;--line:#d8ded8;--green:#26734d;--yellow:#f2c94c;--blue:#2869a8;--red:#c84a43}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:0}
button,input{font:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:40px 0 72px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.55fr);border-top:8px solid var(--green);overflow:hidden}.hero-main{padding:34px}.eyebrow{margin:0;color:var(--green);font-weight:800}.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.08;margin:10px 0 18px;letter-spacing:0}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.states{display:grid;background:#eef3ee}.state{padding:26px;border-left:1px solid var(--line)}.state strong{display:block;color:var(--blue);margin-bottom:6px}.state.goal strong{color:var(--red)}
.section{margin-top:18px;padding:24px}.section h2{font-size:23px;margin:0 0 16px;letter-spacing:0}.progress-row{display:flex;align-items:center;gap:14px;margin-top:18px}.progress{height:10px;flex:1;background:#e4e8e3;overflow:hidden}.progress>div{height:100%;width:0;background:var(--green);transition:width .2s}.progress-copy{min-width:110px;text-align:right;font-weight:800}
.win{margin-top:18px;padding:20px 24px;border-left:6px solid var(--yellow);background:#fff}.win strong{color:#765b00}.stage-tabs,.phase-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.stage-tab,.phase-tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;cursor:pointer;white-space:nowrap}.stage-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.phase-tab.active{background:#eaf2f8;color:#174f7f;border-color:var(--blue)}
.stage-detail{margin-top:14px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:20px;padding:22px;background:#fbfcfa;border:1px solid var(--line)}.stage-index{width:64px;height:64px;display:grid;place-items:center;background:var(--yellow);font-size:24px;font-weight:900}.duration{color:var(--blue);font-weight:800}.stage-detail h3{font-size:26px;line-height:1.2;margin:3px 0 10px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.evidence>div{padding:14px;border-left:4px solid var(--green);background:#fff}.evidence>div:last-child{border-left-color:var(--red)}
.task-list{display:grid;gap:10px;margin-top:14px}.task{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:13px;border:1px solid var(--line);background:#fff}.task input{width:19px;height:19px;margin-top:4px;accent-color:var(--green)}.task.done span{text-decoration:line-through;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tree-list{display:grid;gap:9px}.tree-item{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}.tree-item b{width:28px;height:28px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:13px}.deliverables{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.deliverable{padding:16px;border-top:4px solid var(--blue);background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.deliverable:nth-child(3n+2){border-top-color:var(--green)}.deliverable:nth-child(3n){border-top-color:var(--yellow)}
.method-list{display:flex;flex-wrap:wrap;gap:8px}.method{padding:7px 11px;background:#edf3ef;border:1px solid #c8d8ce}.review-toggle{border:0;background:var(--blue);color:#fff;padding:10px 14px;cursor:pointer}.review{display:none;margin-top:14px}.review.open{display:block}.review li{margin:8px 0}ul{padding-left:20px}
@media(max-width:760px){.shell{width:min(100% - 22px,1120px);padding-top:18px}.hero,.two-col{grid-template-columns:1fr}.states{grid-template-columns:1fr 1fr}.state{border-left:0;border-top:1px solid var(--line)}.stage-detail{grid-template-columns:1fr}.evidence,.deliverables{grid-template-columns:1fr}.hero h1{font-size:36px}}
@media print{body{background:#fff}.shell{width:100%;padding:0}.panel{break-inside:avoid}.stage-tabs,.phase-tabs{overflow:visible}.review{display:block}}
</style>
</head>
<body><main class="shell" id="app"></main>
<script id="learning-plan-data" type="application/json">{"title": "8周从运营表格到独立数据分析项目", "learner": "熟悉 Excel、零编程基础的运营专员", "start_state": "能制作常规报表，但依赖手工清洗和经验判断", "goal_state": "能用 SQL 与 Python完成清洗、分析和可解释的业务汇报", "time_budget": "工作日每天 1 小时，周末 3 小时，共 8 周", "methodologies": ["项目制学习", "刻意练习", "检索练习", "案例复盘"], "knowledge_tree": ["指标口径与业务问题", "SQL 查询与数据模型", "Python 数据清洗", "探索性分析", "可视化与结论表达"], "task_tree": ["定义业务问题", "抽取并检查数据", "清洗异常数据", "完成指标分析", "制作汇报并接受反馈"], "phases": [{"id": "metrics", "title": "从业务问题到指标", "duration": "第 1 周", "ability": "把模糊运营问题改写为可计算的指标和假设", "tasks": ["拆解一个真实业务问题", "建立指标字典", "画出数据来源与口径关系"], "deliverable": "业务问题树与指标字典", "pass_criteria": "同事能根据定义复算三个核心指标"}, {"id": "sql", "title": "用SQL拿到可信数据", "duration": "第 2-3 周", "ability": "独立完成筛选、聚合、关联和分组分析", "tasks": ["完成 30 道递进查询练习", "复现一张运营周报", "为查询增加空值与重复检查"], "deliverable": "可复用 SQL 查询集与数据质量清单", "pass_criteria": "换一份同结构数据仍能正确生成周报"}, {"id": "python", "title": "用Python清洗和探索", "duration": "第 4-5 周", "ability": "使用 pandas 完成合并、清洗、统计和异常定位", "tasks": ["读取并合并三份表格", "处理缺失值和异常值", "输出探索性分析图表"], "deliverable": "可重复运行的数据清洗与探索脚本", "pass_criteria": "从原始文件到分析表可一键重跑且无手工修改"}, {"id": "project", "title": "完成业务分析项目", "duration": "第 6-8 周", "ability": "把分析结果转化为有边界、可行动的业务建议", "tasks": ["选择一个留存或转化问题", "完成分析、可视化和结论", "邀请一位业务同事评审并修改"], "deliverable": "完整分析项目、汇报稿与复盘记录", "pass_criteria": "10 分钟内讲清问题、证据、限制和下一步行动"}], "final_deliverables": ["业务问题树", "指标字典", "SQL 查询集", "Python 清洗脚本", "分析项目报告", "作品复盘"], "today_win": "选一张正在使用的运营报表，为三个指标补上定义、时间窗口和数据来源", "review_rules": ["练习卡住 30 分钟先缩小数据集再定位问题", "每周随机重做两道旧题进行检索练习", "脚本只能在本人电脑运行时补充环境和输入说明", "结论无法落到业务动作时回到原始问题重新拆解"]}</script>
<script>
const plan=JSON.parse(document.getElementById('learning-plan-data').textContent);const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='learning-path:'+plan.title;let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){saved={}}let activeStage=0;let activePhase=0;
const numbered=items=>items.map((item,index)=>`<div class="tree-item"><b>${index+1}</b><span>${esc(item)}</span></div>`).join('');
app.innerHTML=`<header class="hero panel"><div class="hero-main"><p class="eyebrow">个性化学习成长地图</p><h1>${esc(plan.title)}</h1><div class="meta"><span>${esc(plan.learner)}</span><span>${esc(plan.time_budget)}</span></div><div class="progress-row"><div class="progress"><div id="globalBar"></div></div><div class="progress-copy" id="globalProgress">0 / 0</div></div></div><div class="states"><div class="state"><strong>起点</strong>${esc(plan.start_state)}</div><div class="state goal"><strong>终点</strong>${esc(plan.goal_state)}</div></div></header><section class="win"><strong>今天的小胜利</strong><br>${esc(plan.today_win)}</section><section class="panel section"><h2>成长路线</h2><div class="stage-tabs" id="stageTabs"></div><div id="stageDetail"></div></section><section class="panel section"><h2>全周期行动卡</h2><div class="phase-tabs" id="phaseTabs"></div><div class="progress-row"><div class="progress"><div id="phaseBar"></div></div><div class="progress-copy" id="phaseProgress">0 / 0</div></div><div class="task-list" id="taskList"></div></section><section class="two-col"><div class="panel section"><h2>知识树</h2><div class="tree-list">${numbered(plan.knowledge_tree)}</div></div><div class="panel section"><h2>任务树</h2><div class="tree-list">${numbered(plan.task_tree)}</div></div></section><section class="panel section"><h2>成果展台</h2><div class="deliverables">${plan.final_deliverables.map(x=>`<div class="deliverable">${esc(x)}</div>`).join('')}</div></section><section class="panel section"><h2>学习装备</h2><div class="method-list">${plan.methodologies.map(x=>`<span class="method">${esc(x)}</span>`).join('')}</div></section><section class="panel section"><h2>复盘与升级</h2><button class="review-toggle" id="reviewToggle" type="button">显示复盘规则</button><div class="review" id="review"><ul>${plan.review_rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>`;
function renderStage(){const tabs=document.getElementById('stageTabs');tabs.innerHTML=plan.phases.map((p,i)=>`<button class="stage-tab ${i===activeStage?'active':''}" data-stage="${i}" type="button">${i+1}. ${esc(p.title)}</button>`).join('');const p=plan.phases[activeStage];document.getElementById('stageDetail').innerHTML=`<article class="stage-detail"><div class="stage-index">${activeStage+1}</div><div><div class="duration">${esc(p.duration)}</div><h3>${esc(p.title)}</h3><p><strong>解锁能力：</strong>${esc(p.ability)}</p><div class="evidence"><div><strong>本站作品</strong><br>${esc(p.deliverable)}</div><div><strong>通关标准</strong><br>${esc(p.pass_criteria)}</div></div></div></article>`;tabs.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{activeStage=Number(button.dataset.stage);activePhase=activeStage;renderStage();renderTasks()}))}
function taskId(phaseIndex,taskIndex){return `${plan.phases[phaseIndex].id}-${taskIndex}`}
function updateProgress(){const all=[];plan.phases.forEach((p,pi)=>p.tasks.forEach((_,ti)=>all.push(taskId(pi,ti))));const done=all.filter(id=>saved[id]).length;document.getElementById('globalBar').style.width=(all.length?done/all.length*100:0)+'%';document.getElementById('globalProgress').textContent=`${done} / ${all.length} 项`;const phase=plan.phases[activePhase];const phaseDone=phase.tasks.filter((_,ti)=>saved[taskId(activePhase,ti)]).length;document.getElementById('phaseBar').style.width=(phase.tasks.length?phaseDone/phase.tasks.length*100:0)+'%';document.getElementById('phaseProgress').textContent=`${phaseDone} / ${phase.tasks.length} 项`;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){}}
function renderTasks(){const tabs=document.getElementById('phaseTabs');tabs.innerHTML=plan.phases.map((p,i)=>`<button class="phase-tab ${i===activePhase?'active':''}" data-phase="${i}" type="button">${esc(p.duration)}</button>`).join('');const phase=plan.phases[activePhase];document.getElementById('taskList').innerHTML=phase.tasks.map((task,i)=>{const id=taskId(activePhase,i);return `<label class="task ${saved[id]?'done':''}"><input type="checkbox" data-id="${esc(id)}" ${saved[id]?'checked':''}><span>${esc(task)}</span></label>`}).join('');tabs.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{activePhase=Number(button.dataset.phase);renderTasks()}));document.querySelectorAll('.task input').forEach(box=>box.addEventListener('change',()=>{saved[box.dataset.id]=box.checked;box.closest('.task').classList.toggle('done',box.checked);updateProgress()}));updateProgress()}
document.getElementById('reviewToggle').addEventListener('click',event=>{const review=document.getElementById('review');review.classList.toggle('open');event.currentTarget.textContent=review.classList.contains('open')?'收起复盘规则':'显示复盘规则'});renderStage();renderTasks();
</script></body></html>
